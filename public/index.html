<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>MyLMS Pocket — Player Offline-First Open-Source</title>
  <meta name="description" content="Player educacional Open-Source Offline-First do MyLMS para estudo sem internet com sincronização inteligente e Tutor IA Local (<=10B)." />
  <meta name="theme-color" content="#f8f7f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/favicon-mylms-light.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <button
        id="btnMobileMenu"
        type="button"
        aria-controls="mobileDrawer"
        aria-expanded="false"
        aria-label="Abrir menu de navegação"
        class="btn btn-icon"
      >
        ☰
      </button>
      <div class="brand-link">
        <img src="/logo-mylms-dark.png" alt="MyLMS" class="brand-logo" />
        <div class="brand-text">
          <div class="brand-title">
            MyLMS <span class="brand-badge">POCKET</span>
          </div>
          <span class="brand-sub">AVA Offline-First • SLM ≤10B</span>
        </div>
      </div>
    </div>

    <div class="topbar-actions">
      <span id="netStatusPill" class="pill pill-online">● Online</span>
      <button id="btnSyncNow" type="button" class="btn btn-sync" title="Sincronizar progresso com o MyLMS">
        🔄 Sync (<span id="syncQueueCount">0</span>)
      </button>
      <button id="btnThemeToggle" type="button" class="btn btn-icon" aria-label="Alternar tema Claro/Escuro" title="Alternar tema Claro/Escuro">
        🌙
      </button>
      <button id="btnInstallPwa" type="button" class="btn btn-primary" style="display:none">
        📲 Instalar
      </button>
    </div>
  </header>

  <div id="drawerOverlay" class="drawer-overlay"></div>
  <aside id="mobileDrawer" class="mobile-drawer" aria-label="Menu Principal">
    <div class="drawer-header">
      <div class="drawer-brand">
        <img src="/logo-mylms-dark.png" alt="MyLMS" class="brand-logo" />
        <div>
          <strong style="font-size:14px;display:block">MyLMS Pocket</strong>
          <span style="font-size:11px;color:var(--muted-foreground)">AVA Offline-First</span>
        </div>
      </div>
      <button id="btnCloseDrawer" type="button" class="btn btn-icon" aria-label="Fechar menu">✕</button>
    </div>

    <p class="drawer-desc">
      Ambiente Virtual de Aprendizagem Offline-First com banco local (<code>IndexedDB</code> + <code>CacheStorage</code>) e Tutor IA em escala humana (<code>Llama-3.1-8B ≤10B</code>).
    </p>

    <div class="drawer-nav">
      <button id="navCatalogBtn" type="button" class="btn drawer-btn">
        📚 Meus Cursos &amp; Pacotes Offline
      </button>
      <button id="navImportBtn" type="button" class="btn drawer-btn">
        📂 Importar Pacote (.mylms-pocket.json)
      </button>
      <button id="navSimOfflineBtn" type="button" class="btn drawer-btn">
        ✈️ Simular Modo Avião (Teste Offline)
      </button>
      <a href="https://plataforma.mylms.ai" target="_blank" rel="noreferrer" class="btn drawer-btn">
        🌐 Abrir Plataforma MyLMS Completa
      </a>
    </div>

    <div class="drawer-account">
      <div class="drawer-section-label">CONTA SINCRONIZADA MYLMS</div>
      <input
        id="studentEmailInput"
        type="email"
        placeholder="E-mail do aluno (ex: andre@glededu.com)"
        value="andre@glededu.com"
        class="mylms-input"
      />
      <button id="btnSaveEmail" type="button" class="btn btn-primary" style="width:100%;margin-top:8px">
        Salvar Conta do Aluno
      </button>
    </div>

    <div id="drawerLessonsContainer" style="margin-top:16px"></div>
  </aside>

  <input id="fileImportInput" type="file" accept=".json,application/json" style="display:none" />

  <main id="appRoot" class="container"></main>

  <script src="/app.js"></script>
</body>
</html>
