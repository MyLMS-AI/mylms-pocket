<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>MyLMS Pocket — Seus Cursos Offline</title>
  <meta name="description" content="Estude seus cursos do MyLMS em qualquer lugar, mesmo sem conexão com a internet." />
  <meta name="theme-color" content="#f8f7f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/favicon-mylms-light.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <button
        id="btnMobileMenu"
        type="button"
        aria-controls="mobileDrawer"
        aria-expanded="false"
        aria-label="Abrir menu de navegação"
        class="btn btn-icon"
      >
        ☰
      </button>
      <a href="/" class="brand-link" id="brandHomeLink">
        <img src="/logo-mylms-dark.png" alt="MyLMS" class="brand-logo" />
        <div class="brand-text">
          <div class="brand-title">
            MyLMS <span class="brand-badge">POCKET</span>
          </div>
          <span class="brand-sub">Estudo Offline</span>
        </div>
      </a>
    </div>

    <div class="topbar-actions">
      <span id="netStatusPill" class="pill pill-online">● Online</span>
      <button id="btnSyncNow" type="button" class="btn btn-sync" title="Sincronizar seu progresso com o MyLMS">
        🔄 Sync (<span id="syncQueueCount">0</span>)
      </button>
      <button id="btnAuthHeader" type="button" class="btn" title="Sua conta MyLMS">
        👤 Entrar
      </button>
      <button id="btnThemeToggle" type="button" class="btn btn-icon" aria-label="Alternar tema Claro/Escuro" title="Alternar tema Claro/Escuro">
        🌙
      </button>
      <button id="btnInstallPwa" type="button" class="btn btn-primary" style="display:none">
        📲 Instalar App
      </button>
    </div>
  </header>

  <div id="drawerOverlay" class="drawer-overlay"></div>
  <aside id="mobileDrawer" class="mobile-drawer" aria-label="Menu Principal">
    <div class="drawer-header">
      <div class="drawer-brand">
        <img src="/logo-mylms-dark.png" alt="MyLMS" class="brand-logo" />
        <div>
          <strong style="font-size:14px;display:block">MyLMS Pocket</strong>
          <span style="font-size:11px;color:var(--muted-foreground)">Meus Cursos Offline</span>
        </div>
      </div>
      <button id="btnCloseDrawer" type="button" class="btn btn-icon" aria-label="Fechar menu">✕</button>
    </div>

    <div class="drawer-nav">
      <button id="navCatalogBtn" type="button" class="btn drawer-btn">
        📚 Início &amp; Meus Cursos
      </button>
      <button id="navDownloadedBtn" type="button" class="btn drawer-btn">
        📲 Baixados no Aparelho
      </button>
      <button id="navAdminCurationBtn" type="button" class="btn drawer-btn" style="display:none">
        ⚙️ Curadoria de Cursos (Admin)
      </button>
      <button id="navImportBtn" type="button" class="btn drawer-btn">
        📂 Importar Curso (.json)
      </button>
      <button id="navSimOfflineBtn" type="button" class="btn drawer-btn">
        ✈️ Testar Modo Sem Internet
      </button>
      <a href="https://plataforma.mylms.ai" target="_blank" rel="noreferrer" class="btn drawer-btn">
        🌐 Ir para Plataforma MyLMS
      </a>
    </div>

    <div id="drawerAuthCard" class="drawer-account"></div>
    <div id="drawerLessonsContainer" style="margin-top:16px"></div>
  </aside>

  <!-- Modal Oficial de Login MyLMS (E-mail + Código OTP) -->
  <div id="authModalOverlay" class="auth-modal-overlay" aria-hidden="true">
    <div class="auth-modal-card" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
      <button id="btnCloseAuthModal" type="button" class="auth-modal-close" aria-label="Fechar">✕</button>
      <div id="authModalBody"></div>
    </div>
  </div>

  <input id="fileImportInput" type="file" accept=".json,application/json" style="display:none" />

  <main id="appRoot" class="container"></main>

  <script src="/app.js"></script>
</body>
</html>
